<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <!-- Add Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Add Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <!-- Brand Name -->
    <a class="navbar-brand d-flex align-items-center" href="#">
      <i class="fas fa-school me-2 fs-4"></i>
      <span class="fs-5 fw-bold">School Management System</span>
    </a>

    <!-- Hamburger Menu for Small Screens -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Links -->
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav ms-auto">
        <!-- Home Link -->
        <li class="nav-item mx-2">
          <a class="nav-link d-flex align-items-center" href="#" th:href="@{/home}">
            <i class="fas fa-home me-2"></i>Home
          </a>
        </li>
        <!-- Students Link -->
        <li class="nav-item mx-2" th:if="${userRole != null and userRole.contains('ADMIN')}">
          <a class="nav-link d-flex align-items-center" href="#" th:href="@{/students}">
            <i class="fas fa-users me-2"></i>Students
          </a>
        </li>
        <!-- Modules Link -->
        <li class="nav-item mx-2" th:if="${userRole.contains('ADMIN')}">
          <a class="nav-link d-flex align-items-center" href="#" th:href="@{/modules}">
            <i class="fas fa-book me-2"></i>Modules
          </a>
        </li>
        <!-- Departments Link -->
        <li class="nav-item mx-2">
          <a class="nav-link d-flex align-items-center" href="#" th:href="@{/departements}" th:if="${userRole != null and userRole.contains('ADMIN')}">
            <i class="fas fa-book me-2"></i>Departments
          </a>
        </li>
        <!-- Professors Link -->
        <li class="nav-item mx-2" th:if="${userRole != null && userRole.size() > 0 && userRole.contains('ADMIN')}">
          <a class="nav-link d-flex align-items-center" href="#" th:href="@{/professors}">
            <i class="fas fa-chalkboard-teacher me-2"></i>Professors
          </a>
        </li>
        <!-- User Icon with Dropdown -->
        <li class="nav-item dropdown mx-2">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-user-circle fa-lg me-2"></i>
            <span th:text="${username}" class="fw-medium"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
            <!-- Change Password Button -->
            <li>
              <a class="dropdown-item d-flex align-items-center" th:href="@{/change-password}">
                <i class="fas fa-key me-2"></i>Change Password
              </a>
            </li>
            <!-- Logout Button -->
            <li>
              <a class="dropdown-item d-flex align-items-center text-danger" th:href="@{/logout}">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Add Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
