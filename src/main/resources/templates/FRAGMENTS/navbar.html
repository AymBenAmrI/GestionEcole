<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <!-- Brand Name -->
    <a class="navbar-brand" href="#">
      <i class="fas fa-school me-2"></i>School Management System
    </a>

    <!-- Hamburger Menu for Small Screens -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Links -->
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav ms-auto">
        <!-- Home Link -->
        <li class="nav-item">
          <a class="nav-link" href="#" th:href="@{/home}">
            <i class="fas fa-home me-1"></i>Home
          </a>
        </li>
        <li class="nav-item" th:if="${userRole != null and userRole.contains('ADMIN')}">
          <a class="nav-link" href="#" th:href="@{/students}">
            <i class="fas fa-users me-1"></i>Students
          </a>
        </li>
        <li class="nav-item" th:if="${userRole.contains('ADMIN')}">
          <a class="nav-link" href="#" th:href="@{/modules} ">
            <i class="fas fa-book me-1"></i>Modules
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" th:href="@{/departements}" th:if="${userRole != null and userRole.contains('ADMIN')}">
            <i class="fas fa-book me-1"></i>Departements
          </a>
        </li>
        <li class="nav-item" th:if="${userRole != null && userRole.size() > 0 && userRole.contains('ADMIN')}">
          <a class="nav-link" href="#" th:href="@{/professors}">
          <i class="fas fa-person me-1"></i>Professors
        </a>
      </li>
        <!-- User Icon with Dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-user-circle fa-lg me-2"></i><p th:text="${username}"></p>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <!-- Change Password Button -->
            <li>
              <a class="dropdown-item" th:href="@{/change-password}">
                <i class="fas fa-key me-2"></i>Change Password
              </a>
            </li>
            <!-- Logout Button -->
            <li>
              <a class="dropdown-item text-danger" th:href="@{/logout}">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
</html>
