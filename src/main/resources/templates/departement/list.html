<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>

<div class="container mt-4">


    <h2 class="text-center">List of Departments</h2>

    <table class="table table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Professors</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dept : ${departements}">
            <td th:text="${dept.getId()}"></td>
            <td th:text="${dept.getName()}"></td>
            <td th:text="${dept.getLocation()}"></td>
            <td>
                <!-- Dropdown Button -->
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        View Professors
                    </button>
                    <ul class="dropdown-menu">
                        <li th:each="prof : ${dept.getProfessors()}">
                            <a class="dropdown-item" href="#" th:text="${prof.getFirstName() + ' ' + prof.getLastName()}"></a>
                        </li>
                        <li th:if="${dept.professors.isEmpty()}">
                            <a class="dropdown-item text-muted">No Professors</a>
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</html>
