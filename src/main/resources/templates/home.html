<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - School Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .dashboard-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .stat-card h3 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .stat-card p {
            font-size: 1.2rem;
            color: #555;
        }
        .table {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .table thead {
            background-color: #2c3e50;
            color: white;
        }
        .table th, .table td {
            padding: 12px;
            text-align: center;
        }
        .table tbody tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Dashboard Header -->
<!--    <div class="dashboard-header">-->
<!--        <h1><i class="fas fa-tachometer-alt me-2"></i>Tableau de bord</h1>-->
<!--    </div>-->
    <div th:replace="~{'FRAGMENTS/navbar' :: navbar}"></div>

    <!-- Statistics Section -->
    <div class="row">
        <div class="col-md-4">
            <div class="stat-card">
                <h3>Étudiants</h3>
                <p><i class="fas fa-users me-2"></i><span th:text="${totalStudents}"></span></p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <h3>Modules</h3>
                <p><i class="fas fa-book me-2"></i><span th:text="${totalModules}"></span></p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <h3>Inscriptions</h3>
                <p><i class="fas fa-clipboard-list me-2"></i><span th:text="${totalEnrollments}"></span></p>
            </div>
        </div>
    </div>

    <!-- Popular Modules Section -->
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4"><i class="fas fa-chart-line me-2"></i>Modules les plus populaires</h2>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Nom du module</th>
                        <th>Nombre d'inscriptions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="module : ${popularModules}">
                        <td th:text="${module.name}"></td>
                        <td th:text="${module.enrollments.size()}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
