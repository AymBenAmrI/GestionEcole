<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Module - School Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        .create-module-card {
            background: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 700px;
            margin: 2rem auto;
            position: relative;
            overflow: hidden;
        }

        .create-module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #212529;
        }

        .form-header {
            margin-bottom: 2rem;
            text-align: center;
            color: #212529;
        }

        .form-header i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
            color: #212529;
        }

        .form-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
        }

        .form-label {
            font-weight: 500;
            color: #212529;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            border-color: #212529;
            box-shadow: 0 0 0 0.25rem rgba(33, 37, 41, 0.25);
        }

        .form-control::placeholder {
            color: #6c757d;
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .btn-custom {
            background-color: #212529;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            border-radius: 0.375rem;
            transition: all 0.2s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #1a1e21;
            transform: translateY(-1px);
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        }

        .btn-custom:active {
            transform: translateY(0);
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-floating > label {
            padding: 0.75rem 1rem;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        @media (max-width: 768px) {
            .create-module-card {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>
<div class="container">
    <div class="create-module-card">
        <div class="form-header">
            <i class="fas fa-book"></i>
            <h1>Create Module</h1>
        </div>

        <form th:action="@{/modules/create}" th:object="${addModuleRequest}" method="post" class="needs-validation" novalidate>
            <!-- Code -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="code" th:field="*{code}" placeholder="Enter module code" required>
                <label for="code">Module Code</label>
            </div>

            <!-- Name -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter module name" required>
                <label for="name">Module Name</label>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}"
                          placeholder="Enter module description" rows="4"></textarea>
            </div>

            <!-- Total Hours -->
            <div class="form-floating mb-4">
                <input type="number" class="form-control" id="totalHours" th:field="*{totalHours}"
                       placeholder="Enter total hours" required min="1">
                <label for="totalHours">Total Hours</label>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-custom btn-lg">
                    <i class="fas fa-save me-2"></i>Create Module
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Form validation script -->
<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>
</body>
</html>
