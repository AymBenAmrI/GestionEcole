<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrolled Students - School Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }
    .enrolled-students-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .table {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }
    .table thead {
      background-color: #2c3e50;
      color: white;
    }
    .table th, .table td {
      padding: 12px;
      text-align: center;
    }
    .table tbody tr:hover {
      background-color: #f1f1f1;
    }
    .btn-custom {
      background-color: #2c3e50;
      color: white;
      border: none;
    }
    .btn-custom:hover {
      background-color: #1a252f;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Enrolled Students Card -->
  <div class="enrolled-students-card">
    <h1 class="text-center mb-4"><i class="fas fa-users me-2"></i>Students Enrolled in Module: <span th:text="${module.name}"></span></h1>

    <!-- Enrolled Students Table -->
    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>Student ID</th>
          <th>Student Name</th>
          <th>Status</th>
          <th>Enrollment Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="enrollment : ${students}">
          <td th:text="${enrollment.student.id}"></td>
          <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}"></td>
          <td th:text="${enrollment.getStatus()}"></td>
          <td th:text="${enrollment.getEnrollmentDate()}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
