<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Module - School Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
    }

    .content-wrapper {
      padding: 2rem 0;
    }

    .edit-module-card {
      background: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      padding: 2rem;
      max-width: 700px;
      margin: auto;
      position: relative;
      overflow: hidden;
    }

    .edit-module-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #212529;
    }

    .form-header {
      margin-bottom: 2rem;
      text-align: center;
      color: #212529;
    }

    .form-header i {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .form-header h1 {
      font-size: 1.75rem;
      margin: 0;
    }

    .form-floating {
      margin-bottom: 1rem;
    }

    .form-label {
      font-weight: 500;
      color: #212529;
    }

    .form-control {
      padding: 0.75rem 1rem;
      border: 1px solid #dee2e6;
      border-radius: 0.375rem;
    }

    .form-control:focus {
      border-color: #212529;
      box-shadow: 0 0 0 0.25rem rgba(33, 37, 41, 0.25);
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .btn-custom {
      background-color: #212529;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-custom:hover {
      background-color: #343a40;
      color: white;
    }

    @media (max-width: 768px) {
      .edit-module-card {
        margin: 1rem;
      }
    }
  </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>

<div class="content-wrapper">
  <div class="container">
    <div class="edit-module-card">
      <div class="form-header">
        <i class="fas fa-edit"></i>
        <h1>Edit Module</h1>
      </div>

      <form th:action="@{/modules/edit/{id}(id=${editModuleRequest.id})}" th:object="${editModuleRequest}" method="post">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="code" th:field="*{code}" placeholder="Enter code" required>
          <label for="code">Code</label>
        </div>

        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter name" required>
          <label for="name">Name</label>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" th:field="*{description}" rows="4"
                    placeholder="Enter module description"></textarea>
        </div>

        <div class="form-floating mb-4">
          <input type="number" class="form-control" id="totalHours" th:field="*{totalHours}"
                 placeholder="Enter total hours" required min="1">
          <label for="totalHours">Total Hours</label>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-custom btn-lg">
            <i class="fas fa-save me-2"></i>Update Module
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
