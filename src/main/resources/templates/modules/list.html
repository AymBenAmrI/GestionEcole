<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules - School Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn-custom {
            background-color: #2c3e50;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #1a252f;
        }
        .table {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .table thead {
            background-color: #2c3e50;
            color: white;
        }
        .table th, .table td {
            padding: 12px;
            text-align: center;
        }
        .table tbody tr:hover {
            background-color: #f1f1f1;
        }
        .actions a {
            margin: 0 5px;
            text-decoration: none;
        }
        .actions a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>

    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-book me-2"></i>Modules</h1>
    </div>

    <!-- Add New Module Button -->
    <div class="mb-4">
        <a href="/modules/create" class="btn btn-custom">
            <i class="fas fa-plus me-2"></i>Add New Module
        </a>
    </div>

    <!-- Modules Table -->
    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Total Hours</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="module : ${modules}">
                <td th:text="${module.code}"></td>
                <td th:text="${module.name}"></td>
                <td th:text="${module.description}"></td>
                <td th:text="${module.totalHours}"></td>
                <td class="actions">
                    <a th:href="@{/modules/edit/{id}(id=${module.id})}" class="btn btn-sm btn-custom">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a th:href="@{/modules/delete/{id}(id=${module.id})}" class="btn btn-sm btn-danger">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                    <a th:href="@{/modules/{id}/students(id=${module.id})}" class="btn btn-sm btn-custom">
                        <i class="fas fa-users"></i> View Students
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
