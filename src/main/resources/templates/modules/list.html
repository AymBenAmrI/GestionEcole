<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules - School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .content-wrapper {
            padding: 2rem 0;
        }

        .page-header {
            background: #212529;
            color: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        .table-card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            overflow: hidden;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background-color: #212529;
            color: white;
        }

        .table th {
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
        }

        .table td {
            vertical-align: middle;
        }

        .btn-custom {
            background-color: #212529;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            transition: all 0.2s;
        }

        .btn-custom:hover {
            background-color: #343a40;
            color: white;
        }

        .btn-custom i {
            width: 1rem;
            text-align: center;
        }

        .btn-action {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
        }

        .actions {
            white-space: nowrap;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        .description-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>

<div class="content-wrapper">
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-book me-2"></i>Modules</h1>
        </div>
        <div class="mb-4">
            <a href="/modules/create" class="btn btn-custom">
                <i class="fas fa-plus me-2"></i> Add Module
            </a>
        </div>
        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Total Hours</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="module : ${modules}">
                        <td th:text="${module.code}"></td>
                        <td th:text="${module.name}"></td>
                        <td class="description-cell" th:text="${module.description}"></td>
                        <td class="text-center" th:text="${module.totalHours}"></td>
                        <td class="actions text-center">
                            <a th:href="@{/modules/edit/{id}(id=${module.id})}" class="btn btn-custom btn-action">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/modules/{id}/students(id=${module.id})}" class="btn btn-custom btn-action">
                                <i class="fas fa-users"></i>
                            </a>
                            <a th:href="@{/modules/delete/{id}(id=${module.id})}" class="btn btn-danger btn-action">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
