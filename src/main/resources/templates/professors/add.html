<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Professor - School Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .add-professor-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }
        .form-label {
            font-weight: 600;
            color: #1a1a1a;
        }
        .form-control {
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 0.25rem rgba(26, 26, 26, 0.25);
        }
        .btn-custom {
            background-color: #1a1a1a;
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-size: 1.1rem;
        }
        .btn-custom:hover {
            background-color: #343a40;
            color: white;
        }
        .header-title {
            color: #1a1a1a;
            font-weight: bold;
        }
    </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>
<div class="container">
    <!-- Add Professor Card -->
    <div class="add-professor-card">
        <h1 class="text-center mb-4 header-title"><i class="fas fa-user-plus me-2"></i>Add Professor</h1>

        <!-- Add Professor Form -->
        <form th:action="@{/professors/add}" th:object="${addProfessorRequest}" method="post">
            <!-- Hidden Matricule Field -->
            <input type="hidden" th:field="*{matricule}">

            <!-- First Name -->
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
            </div>

            <!-- Last Name -->
            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>

            <!-- Department -->
            <div class="mb-3">
                <label for="departement" class="form-label">Department</label>
                <select class="form-control" id="departement" th:field="*{departement}" required>
                    <option value="">-- Select Department --</option>
                    <option th:each="dept : ${departments}" th:value="${dept.getName()}" th:text="${dept.getName()}"></option>
                </select>
            </div>

            <!-- Hiring Date -->
            <div class="mb-3">
                <label for="hiringDate" class="form-label">Hiring Date</label>
                <input type="date" class="form-control" id="hiringDate" th:field="*{hiringDate}" required>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-custom">
                    <i class="fas fa-save me-2"></i>Save
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
