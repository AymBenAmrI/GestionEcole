<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professor Details - School Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .professor-details-card {
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(255, 255, 255, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .table {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0.5rem 1rem rgba(255, 255, 255, 0.1);
    }
    .table thead {
      background-color: #212529;
      color: white;
    }
    .table th, .table td {
      padding: 12px;
      text-align: center;
    }
    .table td {

      background-color: #ffffff;
    }
    .table tbody tr:hover {
      background-color: #333333;
    }
    .btn-custom {
      background-color: #212529;
      color: white;
      border: none;
    }

    a {
      color: #212529;
    }
    a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>
<div class="container">
  <!-- Professor Details Card -->
  <div class="professor-details-card">
    <h1 class="text-center mb-4"><i class="fas fa-chalkboard-teacher me-2"></i>Professor Details</h1>

    <!-- Professor Information -->
    <div class="mb-4">
      <p><strong>ID:</strong> <span th:text="${professor.id}"></span></p>
      <p><strong>First Name:</strong> <span th:text="${professor.firstName}"></span></p>
      <p><strong>Last Name:</strong> <span th:text="${professor.lastName}"></span></p>
      <p><strong>Department:</strong> <span   th:text="${professor.departement != null ? professor.departement.getName() : 'No Department'}"></span></p>
      <p><strong>Hiring Date:</strong> <span th:text="${professor.getHiringDate()}"></span></p>
    </div>

    <!-- Assigned Modules Section -->
    <h2 class="mb-4"><i class="fas fa-book me-2"></i>Assigned Modules</h2>
    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>Module Code</th>
          <th>Module Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="module : ${professor.getModules()}">
          <td th:text="${module.getId()}"></td>
          <td th:text="${module.getName()}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Back to List Button -->
  <div th:if="${userRole.contains('ADMIN')}" class="text-center mt-4">
    <a href="/professors" class="btn btn-custom">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
