<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Professor - School Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .edit-professor-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .form-label {
      font-weight: 500;
      color: #2c3e50;
    }
    .form-control:focus {
      border-color: #2c3e50;
      box-shadow: 0 0 0 0.25rem rgba(44, 62, 80, 0.25);
    }
    .btn-custom {
      background-color: #212529;
      color: white;
      border: none;
    }
    .btn-custom:hover {
      background-color: #1a252f;
    }
  </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>
<div class="container">
  <!-- Edit Professor Card -->
  <div class="edit-professor-card">
    <h1 class="text-center mb-4"><i class="fas fa-user-edit me-2"></i>Edit Professor</h1>

    <!-- Edit Professor Form -->
    <form th:action="@{/professors/edit/{id}(id=${editProfessorRequest.id})}" th:object="${editProfessorRequest}" method="post">
      <!-- Hidden Matricule Field -->
      <input type="hidden" th:field="*{matricule}">

      <!-- First Name -->
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
      </div>

      <!-- Last Name -->
      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
      </div>
      <!-- Department -->
      <div class="mb-3">
        <label for="department" class="form-label">Department</label>
        <select class="form-control" id="department" th:field="*{departement}" required>
        <option value="">-- Select Department --</option>
<!--        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.getName()}"></option>-->
      </select>
      </div>
      <!-- Submit Button -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-custom btn-lg">
          <i class="fas fa-save me-2"></i>Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
