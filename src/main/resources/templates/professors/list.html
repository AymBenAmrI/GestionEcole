<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professors List - School Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            background-color: #212529;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        .btn-custom {
            background-color: #212529;
            color: white;
            border: none;
        }
        /*.btn-custom {*/
        /*    background-color: #212529;*/
        /*    color: white;*/
        /*    border: none;*/
        /*    border-radius: 8px;*/
        /*    padding: 12px;*/
        /*    font-size: 16px;*/
        /*    display: inline-block;*/
        /*    transition: background-color 0.3s;*/
        /*}*/

        .table {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .table thead {
            background-color: #212529;
            color: white;
        }
        .table th, .table td {
            padding: 15px;
            text-align: center;
        }
        .table tbody tr {
            transition: background-color 0.3s;
        }
        .table tbody tr:hover {
            background-color: #f1f3f5;
        }
        .actions a {
            margin: 0 5px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .actions a:hover {
            color: #2c3e50;
        }
        .module-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .module-list li {
            background: #e9ecef;
            padding: 6px;
            border-radius: 5px;
            margin: 5px 0;
            font-size: 14px;
        }
        .form-select {
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            margin-top: 10px;
        }
        .form-select:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 5px rgba(44, 62, 80, 0.5);
        }
        .module-list li {
            font-size: 14px;
        }
    </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-chalkboard-teacher me-2"></i> Professors List</h1>
    </div>

    <!-- Add Professor Button -->
    <div class="mb-4">
        <a href="/professors/add" class="btn btn-custom">
            <i class="fas fa-user-plus me-2"></i> Add Professor
        </a>
    </div>

    <!-- Professors Table -->
    <div class="table-responsive">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Department</th>
                <th>Hiring Date</th>
                <th>Modules</th>
                <th>Assign Module</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="professor : ${professors}">
                <td th:text="${professor.id}"></td>
                <td th:text="${professor.firstName}"></td>
                <td th:text="${professor.lastName}"></td>
                <td th:text="${professor.departement != null ? professor.departement.getName() : 'No Department'}"></td>
                <td th:text="${professor.hiringDate}"></td>

                <!-- Assigned Modules List -->
                <td>
                    <ul class="module-list">
                        <li th:each="modu : ${professor.getModules()}" th:text="${modu.getName()}"></li>
                    </ul>
                </td>

                <!-- Assign Module Dropdown -->
                <td>
                    <form th:action="@{/professors/assignModule}" method="post">
                        <input type="hidden" name="professorId" th:value="${professor.id}">
                        <select name="moduleId" class="form-select">
                            <option th:each="modu : ${modules}" th:value="${modu.getId()}" th:text="${modu.getName()}"></option>
                        </select>
                        <button type="submit" class="btn btn-success btn-sm mt-2">
                            <i class="fas fa-plus"></i> Assign
                        </button>
                    </form>
                </td>

                <!-- Actions -->
                <td class="actions">
                    <a th:href="@{/professors/details/{id}(id=${professor.id})}" class="btn btn-custom btn-lg">
                        <i class="fas fa-info-circle"></i> Details
                    </a>
                    <a th:href="@{/professors/edit/{id}(id=${professor.id})}"class="btn btn-custom btn-lg">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a th:href="@{/professors/delete/{id}(id=${professor.id})}" class="btn btn-sm btn-danger">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
