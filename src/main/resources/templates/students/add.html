<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student - School Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }
    .add-student-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .form-label {
      font-weight: 500;
      color: #2c3e50;
    }
    .form-control:focus {
      border-color: #2c3e50;
      box-shadow: 0 0 0 0.25rem rgba(44, 62, 80, 0.25);
    }
    .btn-custom {
      background-color: #2c3e50;
      color: white;
      border: none;
    }
    .btn-custom:hover {
      background-color: #1a252f;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Add Student Card -->
  <div th:replace="~{'FRAGMENTS/navbar' :: navbar}"></div>
  <div class="add-student-card">

    <!-- Add Student Form -->
    <form th:action="@{/students/add}" method="post" th:object="${addStudentRequest}" enctype="multipart/form-data">
      <!-- Matricule -->
      <div class="mb-3">
        <label for="matricule" class="form-label">Matricule</label>
        <input type="text" class="form-control" id="matricule" th:field="*{matricule}" required>
      </div>

      <!-- First Name -->
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
      </div>

      <!-- Last Name -->
      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" required>
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" th:field="*{address}">
      </div>

      <!-- Birth Date -->
      <div class="mb-3">
        <label for="birthDate" class="form-label">Birth Date</label>
        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}">
      </div>

      <!-- Submit Button -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-custom btn-lg">
          <i class="fas fa-save me-2"></i>Add Student
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
