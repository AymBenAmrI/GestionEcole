<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details - School Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <style>
    body {
      color: black; /* Updated text color to black */
    }
    .student-details-card {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .table {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }
    .table thead {
      background-color: #212529 ;
      color: white;
    }
    .table th, .table td {
      padding: 12px;
      text-align: center;
    }
    .table tbody tr:hover {
      background-color: #f1f1f1;
    }
    .btn-custom {
      background-color: #2c3e50;
      color: white;
      border: none;
    }

    .btn-danger-custom {
      background-color: #dc3545;
      color: white;
      border: none;
    }
    .btn-danger-custom:hover {
      background-color: #bb2d3b;
    }
  </style>
</head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="container">

  <!-- Student Details Card -->
  <div class="student-details-card">

    <!-- Student Information -->
    <div class="mb-4">
      <p><strong>Matricule:</strong> <span th:text="${student.matricule}"></span></p>
      <p><strong>First Name:</strong> <span th:text="${student.firstName}"></span></p>
      <p><strong>Last Name:</strong> <span th:text="${student.lastName}"></span></p>
    </div>

    <!-- Enrolled Modules Section -->
    <h2 class="mb-4"><i class="fas fa-book me-2"></i>Enrolled Modules</h2>
    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>Module Code</th>
          <th>Module Name</th>
          <th>Hours</th>
          <th>Status</th>
          <th>Enrollment Date</th>
          <th th:if="${roles.contains('ADMIN')}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="enrollment : ${enrollments}">
          <td th:text="${enrollment.module.getCode()}"></td>
          <td th:text="${enrollment.module.getName()}"></td>
          <td th:text="${enrollment.module.getTotalHours()}"></td>
          <td th:text="${enrollment.getStatus().name()}"></td>
          <td th:text="${enrollment.getEnrollmentDate()}"></td>
          <td th:if="${roles.contains('ADMIN')}">
            <form th:action="@{/enrollments/remove}" th:method="post" style="display:inline;">
              <input type="hidden" name="studentId" th:value="${student.id}" />
              <input type="hidden" name="moduleId" th:value="${enrollment.module.getId()}" />
              <button type="submit" class="btn btn-danger-custom btn-sm">
                <i class="fas fa-trash me-1"></i>Remove
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Back to List Button -->
  <div class="text-center mt-4" th:if="${roles.contains('ADMIN')}">
    <a href="/students" class="btn btn-custom">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
