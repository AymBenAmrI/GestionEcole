<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student - School Management System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <style>
    body {
      font-family: 'Arial', sans-serif;
    }

    .edit-student-card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }

    .form-label {
      font-weight: 600;
      color: #212529;
    }

    .form-control {
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    .btn-custom {
      background-color: #212529;
      color: white;
      border-radius: 8px;
      font-size: 1.1rem;
      border: none;
      padding: 12px 20px;
    }


    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #212529;
      margin-bottom: 30px;
    }

    .mb-3 {
      margin-bottom: 1.5rem;
    }

    .d-grid {
      margin-top: 20px;
    }
  </style>
</head>
<body>
<th:block th:replace="~{FRAGMENTS/navbar :: navbar}"></th:block>

<div class="container">

  <div class="edit-student-card">
    <!-- Header -->
    <h1 class="text-center mb-4"><i class="fas fa-user-edit me-2"></i>Edit Student</h1>
    <!-- Edit Student Form -->
    <form th:action="@{/students/edit/{id}(id=${editStudentRequest.id})}" th:object="${editStudentRequest}" method="post">
      <!-- Matricule -->
      <div class="mb-3">
        <label for="matricule" class="form-label">Matricule</label>
        <input type="text" class="form-control" id="matricule" th:field="*{matricule}" required>
      </div>

      <!-- First Name -->
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
      </div>
      <input type="hidden" class="form-control" id="hiringdate" th:field="*{birthDate}" th:value="${editStudentRequest.birthDate}">

      <!-- Last Name -->
      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" required>
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" th:field="*{address}">
      </div>

      <!-- Birth Date -->
<!--      <div class="mb-3">-->
<!--        <label for="birthDate" class="form-label">Birth Date</label>-->
<!--        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}">-->
<!--      </div>-->

      <!-- Submit Button -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-custom btn-lg">
          <i class="fas fa-save me-2"></i>Update Student
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
