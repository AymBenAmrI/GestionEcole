<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List - School Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #212529;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            margin-top: 10px;

        }
        .btn-custom {
            background-color: #212529;
            color: white;
            border: none;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .table thead {
            background-color:  #212529;
            /*color:  black;*/
        }
        .table th, .table td {
            padding: 12px;
            text-align: center;
        }
        .table tbody tr:hover {
            background-color: #f1f1f1;
        }
        .search-form {
            margin-bottom: 20px;
        }
        .search-form input {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 8px;
        }
        .search-form button {
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div th:replace="~{'FRAGMENTS/navbar' :: navbar}"></div>

<div class="container">
    <!-- Header -->
<!--    <div class="header">-->
<!--        <h1><i class="fas fa-users me-2"></i>Student List</h1>-->
<!--        <a href="/logout" class="btn btn-custom">Logout</a>-->
<!--    </div>-->

    <div class="header">
        <h1><i class="fas fa-chalkboard-teacher me-2"></i> Student List</h1>
    </div>
    <!-- Add Student Button -->
    <div class="mb-4">
        <a href="/students/add" class="btn btn-custom">
            <i class="fas fa-user-plus me-2"></i>Add Student
        </a>
    </div>

    <!-- Search Form -->
    <form action="/students/search" method="get" class="search-form">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control" placeholder="Search by name">
            <button type="submit" class="btn btn-custom">
                <i class="fas fa-search me-2"></i>Search
            </button>
        </div>
    </form>

    <!-- Batch Enrollment Form -->
    <form th:action="@{/enrollments/enroll-batch}" method="post">
        <h3 class="mb-4"><i class="fas fa-tasks me-2"></i>Select Students to Enroll in Module</h3>

        <!-- Student Table -->
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Select</th>
                    <th>Matricule</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td>
                        <input type="checkbox" name="studentIds" th:value="${student.id}">
                    </td>
                    <td th:text="${student.matricule}"></td>
                    <td th:text="${student.firstName + ' ' + student.lastName}"></td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-custom">
                            <i class="fas fa-info-circle"></i> Details
                        </a>
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-custom">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-sm btn-danger">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Module Selection -->
        <div class="row mt-4">
            <div class="col-md-6">
                <label for="moduleId" class="form-label">Select Module:</label>
                <select id="moduleId" name="moduleId" class="form-select">
                    <option th:each="module : ${modules}" th:value="${module.id}" th:text="${module.name}"></option>
                </select>
            </div>
        </div>

        <!-- Enroll Button -->
        <div class="mt-4">
            <button type="submit" class="btn btn-custom btn-lg">
                <i class="fas fa-user-check me-2"></i>Enroll Selected Students
            </button>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
